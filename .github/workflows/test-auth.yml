name: Test BigQuery Auth

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install google-cloud-bigquery db-dtypes

      - name: Write service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/key.json

      - name: Test BigQuery connection
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json
        run: |
          python3 -c "
          from google.cloud import bigquery
          client = bigquery.Client(project='anomaly-explainer')
          query = 'SELECT COUNT(*) as total FROM \`anomaly-explainer.analytics.daily_purchases\`'
          for row in client.query(query).result():
              print('Row count:', row.total)
          "
